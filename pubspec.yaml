name: is_lint_rules
description: >-
  Analyzer plugin for stricter Dart: no `dynamic`, no `as` on an untyped
  value, no catch-all on a closed type, no `// ignore:`, and more.
version: 0.1.0
repository: https://github.com/intersyntactic/lint_rules

# The analysis server resolves a plugin in a package of its own that depends
# on this one, so these exact pins never enter a using package's solve.

environment:
  sdk: ^3.13.0

dependencies:
  analysis_server_plugin: 0.3.25
  analyzer: 14.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.0
  yaml: ^3.1.4
